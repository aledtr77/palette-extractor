name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # The colour maths and the clustering: sRGB → HSL and sRGB → Lab, the WCAG
      # ratio, the merge threshold, the role assignment, and the CSS and JSON the
      # tool exports. This is the part that runs without a DOM, so it is the part
      # that can be checked without a browser — and it is where a defect hides
      # best, because a wrong contrast ratio still renders a perfectly nice
      # swatch. The rest is checked in a browser, which is the only place it can
      # be checked.
      - name: Test
        run: npm test

      # The README advertises a test count. Typed by hand it is right once and
      # wrong from the next commit on, so this fails the build when the badge
      # and the suite disagree.
      - name: Test-count badge
        run: npm run badge:check

      # This job does not publish: Cloudflare Pages builds the repo itself on
      # every push to main. Building here says that whoever clones it gets
      # something that compiles, and that the deploy is not about to fail.
      - name: Build
        run: npm run build
