<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Codedge Palette Extractor</title>
    <meta
      name="description"
      content="Pull a colour palette out of a photo and get UI roles, WCAG contrast ratios, CSS custom properties and JSON. Runs entirely in the browser — the image is never uploaded."
    />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#2a2a2a" />

    <!-- The tool reads the image locally and has no back end, so there is
         nothing here for a crawler to index beyond this one page. -->
    <link rel="canonical" href="https://palette-extractor-7hm.pages.dev/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Codedge Palette Extractor" />
    <meta
      property="og:description"
      content="Pull a colour palette out of a photo and get UI roles, contrast ratios, CSS custom properties and JSON. Entirely in the browser."
    />
    <meta property="og:url" content="https://palette-extractor-7hm.pages.dev/" />

    <!-- The same screenshot the README shows, served from this site rather than
         from GitHub: it lives in public/, so the build copies it to the root and
         the absolute URL below resolves. og:image has to be absolute — every
         crawler fetches it without a document to resolve a relative path
         against. Without these the link unfurls as a bare grey box. -->
    <meta property="og:image" content="https://palette-extractor-7hm.pages.dev/preview.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="833" />
    <meta
      property="og:image:alt"
      content="The palette extractor after a run: eight dominant colours with share, hex, rgb, hsl and contrast ratio, the UI roles derived from them, and the CSS export."
    />
    <meta property="og:site_name" content="Codedge Palette Extractor" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
