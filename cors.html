<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Palette Lite — Foto → 5 colori</title>
<style>
  :root{--bg:#0b0c10;--panel:#121318;--text:#e7ecf3;--muted:#9aa3b2;--radius:14px}
  *{box-sizing:border-box} body{margin:0;font-family:system-ui,Segoe UI,Roboto,Helvetica,Arial;background:#0b0c10;color:var(--text)}
  .wrap{max-width:920px;margin:32px auto;padding:0 16px}
  .card{background:var(--panel);border:1px solid rgba(255,255,255,.08);border-radius:var(--radius);padding:16px}
  h1{margin:0 0 8px;font-size:20px} p{margin:0 0 12px;color:var(--muted)}
  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
  .ghost{cursor:pointer;border:1px solid rgba(255,255,255,.15);background:transparent;color:#fff;padding:8px 12px;border-radius:10px}
  #palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px;margin-top:12px}
  .sw{border:1px solid rgba(255,255,255,.12);border-radius:12px;overflow:hidden}
  .chip{height:78px}
  .meta{padding:8px 10px;font:12px ui-monospace,Menlo,Consolas}
  .tiny{font-size:12px;color:var(--muted)}
  #log{margin-top:10px;color:#b7c0cf;font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h1>Palette Lite — Foto → 5 colori</h1>
    <p>Carica un <strong>JPG/PNG</strong> locale o usa la <em>Demo</em>. Tutto avviene sul tuo browser.</p>
    <div class="row" style="margin:8px 0 12px">
      <label class="ghost" for="file">Scegli immagine…</label>
      <input id="file" type="file" accept="image/*" hidden>
      <button id="demo" class="ghost">Demo</button>
      <button id="copy" class="ghost">Copia CSS vars</button>
    </div>
    <div class="tiny">Dimensioni analizzate: <span id="dim">—</span> • Campioni: <span id="samples">—</span></div>
    <div id="palette"><div class="tiny">Niente ancora. Carica una foto o premi Demo.</div></div>
    <div id="log"></div>
  </div>
</div>

<canvas id="work" style="display:none"></canvas>

<script>
const file = document.getElementById('file');
const demo = document.getElementById('demo');
const copyBtn = document.getElementById('copy');
const dim = document.getElementById('dim');
const samples = document.getElementById('samples');
const paletteEl = document.getElementById('palette');
const log = document.getElementById('log');

const toHex = v => v.toString(16).padStart(2,'0');
const rgbToHex = (r,g,b) => '#' + toHex(r)+toHex(g)+toHex(b);
function luminance(r,g,b){
  const sr=[r,g,b].map(v=>v/255).map(v=>v<=0.03928?v/12.92:Math.pow((v+0.055)/1.055,2.4));
  return 0.2126*sr[0]+0.7152*sr[1]+0.0722*sr[2];
}
const textFor = (r,g,b) => ( (luminance(r,g,b)+0.05)/(0.05) >= ( (1+0.05)/(luminance(r,g,b)+0.05) ) ? '#000' : '#fff' ); // grezza, ma ok

function renderPalette(colors){
  paletteEl.innerHTML='';
  colors.forEach(({r,g,b,hex,count})=>{
    const sw=document.createElement('div'); sw.className='sw';
    const fg=textFor(r,g,b);
    sw.innerHTML = `<div class="chip" style="background:${hex}"></div>
      <div class="meta">
        <div><strong>${hex.toUpperCase()}</strong></div>
        <div>rgb(${r}, ${g}, ${b}) • campioni ${count}</div>
      </div>`;
    paletteEl.appendChild(sw);
  });
}

function quantizeAndTop(pixels, topN=5){
  // Riduci a 4 bit per canale (bucket 16×16×16 = 4096)
  const map = new Map();
  for(const {r,g,b} of pixels){
    const R=r>>4, G=g>>4, B=b>>4;
    const key = (R<<8)|(G<<4)|B;
    let rec = map.get(key);
    if(!rec) rec = {count:0, rSum:0, gSum:0, bSum:0};
    rec.count++; rec.rSum+=r; rec.gSum+=g; rec.bSum+=b;
    map.set(key, rec);
  }
  const arr = Array.from(map.values())
    .sort((a,b)=>b.count-a.count)
    .slice(0, topN)
    .map(x=>{
      const r = Math.round(x.rSum/x.count);
      const g = Math.round(x.gSum/x.count);
      const b = Math.round(x.bSum/x.count);
      return {r,g,b,hex:rgbToHex(r,g,b),count:x.count};
    });
  return arr;
}

function analyzeSrc(dataUrl){
  return new Promise((resolve,reject)=>{
    const img = new Image();
    // niente crossOrigin qui: data URL / file locale non servono
    img.onload = ()=>{
      try{
        const cvs = document.getElementById('work');
        const ctx = cvs.getContext('2d', { willReadFrequently: true });
        // scala lato maggiore a 240px per velocità
        const maxSide = 240;
        const scale = Math.min(1, maxSide/Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth*scale));
        const h = Math.max(1, Math.round(img.naturalHeight*scale));
        cvs.width = w; cvs.height = h;
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        const data = ctx.getImageData(0,0,w,h).data;
        // stride per ~8000 campioni max
        const total = (w*h);
        const step = Math.max(1, Math.floor(total/8000));
        const pixels = [];
        for(let i=0;i<total;i+=step){
          const off = i*4;
          const a = data[off+3]/255;
          if(a<0.2) continue;
          pixels.push({ r:data[off], g:data[off+1], b:data[off+2] });
        }
        resolve({w,h,pixels});
      }catch(e){
        reject(e);
      }
    };
    img.onerror = e=>reject(e);
    img.src = dataUrl;
  });
}

async function handleDataUrl(dataUrl){
  log.textContent = 'Analisi in corso…';
  try{
    const {w,h,pixels} = await analyzeSrc(dataUrl);
    dim.textContent = `${w}×${h}px`;
    samples.textContent = pixels.length.toString();
    const top = quantizeAndTop(pixels, 5);
    renderPalette(top);
    // salva per copy CSS
    window.__lastPalette = top;
    log.textContent = 'Ok.';
  }catch(e){
    console.error(e);
    log.textContent = 'Errore: impossibile leggere i pixel. Carica un JPG/PNG locale.';
  }
}

file.addEventListener('change', ()=>{
  const f = file.files?.[0]; if(!f){return;}
  const fr = new FileReader();
  fr.onload = ()=>handleDataUrl(fr.result);
  fr.onerror = ()=>{ log.textContent = 'Errore lettura file.'; };
  fr.readAsDataURL(f);
});

demo.addEventListener('click', ()=>{
  // SVG inline → data URL (stessa origine, niente CORS)
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" width="800" height="480">
    <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0ea5e9"/><stop offset="60%" stop-color="#22d3ee"/><stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient></defs>
    <rect width="100%" height="100%" fill="url(#g)"/>
    <circle cx="220" cy="180" r="110" fill="#f59e0b"/><circle cx="580" cy="320" r="160" fill="#ef4444"/>
  </svg>`;
  const url = 'data:image/svg+xml;utf8,'+encodeURIComponent(svg);
  handleDataUrl(url);
});

copyBtn.addEventListener('click', async ()=>{
  const pal = window.__lastPalette;
  if(!pal){ log.textContent = 'Prima genera la palette.'; return; }
  const lines = [':root {'];
  pal.forEach((c,i)=>lines.push(`  --color-${i+1}: ${c.hex};`));
  lines.push('}');
  try{ await navigator.clipboard.writeText(lines.join('\n'));
       log.textContent = 'CSS copiato ✅'; }
  catch(e){ log.textContent = 'Non riesco a copiare negli appunti.'; }
});
</script>
</body>
</html>
